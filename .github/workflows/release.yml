name: Release assets
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm run build && npm run verify-dist
      - run: tar -C dist -czf confidential-chat-dist.tgz .
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: confidential-chat-dist.tgz
      - uses: softprops/action-gh-release@v2
        with:
          files: confidential-chat-dist.tgz
